# 本番環境用の上書き設定
services:
  frontend:
    build:
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports: !override
      - "80:80"
    environment: !reset {}
    volumes:
      # NginxからDjango AdminのCSS/JSを読み取る。
      - django_static:/var/www/django-static:ro

  backend:
    # NginxからCompose内部ネットワーク経由でのみ接続するため、
    # 元のcomposeのポートを上書きして閉じる
    ports: !reset []
    # 一方で、Unicornによる内部通信を続投する場合、
    # backendコンテナが内部通信用に8000番を使用することは続投で良い
    expose:
      - "8000"
    restart: unless-stopped
    volumes:
      # collectstaticの出力先。project/settings.pyのSTATIC_ROOTと一致させる。
      - django_static:/app/static
    # 本番ではDBだけ外部RDSへ切り替え、BrokerはCPU EC2内で起動する
    depends_on: !override
      - broker

  broker:
    ports:
      - "6379:6379"

  worker_ocr_shared:
    # GPU EC2から外部のRDS・Redisへ接続するため、ローカルサービスには依存しない。
    depends_on: !reset []
    gpus: all

  worker_document:
    depends_on: !reset []
    gpus: all

  worker_preview_word:
    depends_on: !reset []
    gpus: all

  worker_maintenance:
    depends_on: !override
      - broker

  celery_beat:
    depends_on: !override
      - broker

volumes:
  django_static:
