server {
    listen 80;
    server_name _;

    # Reactの本番ビルド成果物を配信する。
    root /usr/share/nginx/html;
    index index.html;

    # アプリ側のファイル上限は10MiB。
    # multipart/form-dataの付加情報を考慮し、Nginx側には余裕を持たせる。
    client_max_body_size 20m;

    # ALBが各EC2のDjangoプロセスまで応答可能か確認する。
    # ALBのヘルスチェックはHostにEC2のプライベートIPを使用するため、
    # DjangoのALLOWED_HOSTSに含まれている内部用Hostへ置き換える。
    location = /api/health/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host localhost;
    }

    # Django REST APIへ、/api/を維持したまま転送する。
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Django Adminへ転送する。
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OCR進捗通知用のWebSocketへ転送する。
    location /ocr/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Djangoのcollectstatic出力先を、後でこのパスへマウントする。
    # 現時点では共有ボリューム未接続のため、Django AdminのCSS/JSはまだ配信されない。
    location /static/ {
        alias /var/www/django-static/;
    }

    # 実ファイルが存在しないReact RouterのURLはindex.htmlへ戻す。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
