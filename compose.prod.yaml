# 本番環境用の上書き設定
services:
  frontend:
    build:
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports: !override
      - "80:80"
    environment: !reset {}
    volumes:
      # NginxからDjango AdminのCSS/JSを読み取る。
      - django_static:/var/www/django-static:ro

  backend:
    # NginxからCompose内部ネットワーク経由でのみ接続するため、
    # 元のcomposeのポートを上書きして閉じる
    ports: !reset []
    # 一方で、Unicornによる内部通信を続投する場合、
    # backendコンテナが内部通信用に8000番を使用することは続投で良い
    expose:
      - "8000"
    restart: unless-stopped
    volumes:
      # collectstaticの出力先。project/settings.pyのSTATIC_ROOTと一致させる。
      - django_static:/app/static
    # 本番ではDBだけ外部RDSへ切り替え、BrokerはCPU EC2内で起動する
    depends_on: !override
      - broker

  worker_ocr_shared:
    depends_on: !override
      - broker

  worker_document:
    depends_on: !override
      - broker

  worker_preview_word:
    depends_on: !override
      - broker

  worker_maintenance:
    depends_on: !override
      - broker

  celery_beat:
    depends_on: !override
      - broker

  # CD時の docker compose up でローカル用DBを無視する。
  # local-infrastructure プロファイルに所属させ、これを呼ばないことで無視する
  db:
    profiles:
      - local-infrastructure

volumes:
  django_static:
