name: Infra CI

on:
  push:
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yaml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yaml"

permissions:
  contents: read

jobs:
  lambda-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install boto3==1.43.22

      - name: Run Lambda tests
        run: python -m unittest discover -s infra/tests -v
