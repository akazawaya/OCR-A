name: CD

on:
  workflow_dispatch:

# 同じ環境へのデプロイを同時に実行しない。
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      EC2_TARGET_TAG_KEY: ${{ vars.EC2_TARGET_TAG_KEY }}
      EC2_TARGET_TAG_VALUE: ${{ vars.EC2_TARGET_TAG_VALUE }}
      EC2_PROJECT_DIR: ${{ vars.EC2_PROJECT_DIR }}
      DEPLOY_COMMIT_SHA: ${{ github.sha }} # これはGitHub Actionsが自動で渡してくれる

    steps:
      # 各種変数が渡されていない場合、空文字で通ってしまうため、明示的にエラーを出す。
      - name: Validate deployment variables
        run: |
          set -eu
          : "${AWS_REGION:?AWS_REGION is required}"
          : "${AWS_DEPLOY_ROLE_ARN:?AWS_DEPLOY_ROLE_ARN is required}"
          : "${EC2_TARGET_TAG_KEY:?EC2_TARGET_TAG_KEY is required}"
          : "${EC2_TARGET_TAG_VALUE:?EC2_TARGET_TAG_VALUE is required}"
          : "${EC2_PROJECT_DIR:?EC2_PROJECT_DIR is required}"
          : "${DEPLOY_COMMIT_SHA:?DEPLOY_COMMIT_SHA is required}"

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy, collect static files, and migrate database on EC2
        run: |
          # parametersという変数に以下のコマンドをまとめる。
          # -EC2上のソースを、Workflowを実行したGitHubコミットへ更新する。
          #  originから最新のコミット情報をfetchし、Workflow起動時に確定したコミットSHAをcheckoutする。
          #  そのソースを使用して本番用コンテナを再構築・起動し、
          #  Djangoのcollectstaticとデータベースマイグレーションを実行する。
          parameters=$(jq -n \
            --arg project_dir "$EC2_PROJECT_DIR" \
            --arg deploy_commit "$DEPLOY_COMMIT_SHA" \
            '{
            commands: [
              "set -eu",
              ("cd " + ($project_dir | @sh)),
              "git fetch --prune origin",
              ("git checkout --detach " + ($deploy_commit | @sh)),
              "COMPOSE_PROFILES= docker compose --env-file .env.prod -f compose.yaml -f compose.s3.yaml -f compose.gpu-ec2.yaml -f compose.prod.yaml up -d --build",
              "COMPOSE_PROFILES= docker compose --env-file .env.prod -f compose.yaml -f compose.s3.yaml -f compose.gpu-ec2.yaml -f compose.prod.yaml exec -T backend /app/.venv/bin/python manage.py collectstatic --noinput",
              "COMPOSE_PROFILES= docker compose --env-file .env.prod -f compose.yaml -f compose.s3.yaml -f compose.gpu-ec2.yaml -f compose.prod.yaml exec -T backend /app/.venv/bin/python manage.py migrate --noinput"
            ]
          }')

          # コマンド一覧を、SSM経由で対象EC2へ送信する。
          # 戻り値から今回の命令を追跡するCommand IDだけを取得する。
          command_id=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --targets "Key=tag:${EC2_TARGET_TAG_KEY},Values=${EC2_TARGET_TAG_VALUE}" \
            --document-name "AWS-RunShellScript" \
            --comment "RestOCR deployment from GitHub Actions" \
            --timeout-seconds 3600 \
            --parameters "$parameters" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $command_id"

          # 対象EC2すべての処理が完了するまで待ち、失敗をCDの失敗として扱う。
          for _ in $(seq 1 360); do
            status=$(aws ssm list-commands \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --query "Commands[0].Status" \
              --output text)

            case "$status" in
              Success)
                aws ssm list-command-invocations \
                  --region "$AWS_REGION" \
                  --command-id "$command_id" \
                  --details
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm list-command-invocations \
                  --region "$AWS_REGION" \
                  --command-id "$command_id" \
                  --details
                exit 1
                ;;
              Pending|InProgress|Delayed)
                sleep 10
                ;;
              *)
                echo "Unexpected SSM command status: $status" >&2
                exit 1
                ;;
            esac
          done

          echo "Timed out while waiting for SSM command: $command_id" >&2
          exit 1
