x-s3-env: &s3_env
  ENABLE_S3_STORAGE: "true"
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME}

services:
  backend:
    environment:
      <<: *s3_env

  worker_ocr_shared:
    environment:
      <<: *s3_env

  worker_document:
    environment:
      <<: *s3_env

  worker_preview_word:
    environment:
      <<: *s3_env
