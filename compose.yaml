x-django-env: &django_env
  DJANGO_DEBUG: ${DJANGO_DEBUG}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
  DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
  CHANNEL_REDIS_URL: ${CHANNEL_REDIS_URL}
  CACHE_REDIS_URL: ${CACHE_REDIS_URL}

x-media-volumes: &media_volumes
  - media_input:/app/media

x-worker-common: &worker_common
  build: ./backend
  depends_on:
    - db
    - broker
  working_dir: /app
  environment:
    <<: *django_env
  volumes: *media_volumes

services:
  frontend:
    build:
      context: ./frontend
      target: ${FRONTEND_BUILD_TARGET}
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_CONTAINER_PORT}"
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    command: ${FRONTEND_COMMAND}
  
  backend:
    build: ./backend
    depends_on:
      - db
      - broker
    ports:
      - "8000:8000"
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv/ # ホスト側にruffのインタープリター用の.venvが存在する想定で、同期を無視する
        - action: rebuild
          path: ./backend/uv.lock
        - action: rebuild
          path: ./backend/pyproject.toml  
    environment:
      <<: *django_env
    volumes: *media_volumes
    command:
      ["/app/.venv/bin/python", "-m", "uvicorn", "project.asgi:application", "--host", "0.0.0.0", "--port", "8000"]

  worker_ocr_shared:
    <<: *worker_common
    profiles:
      - ocr-shared
    command:
      [
        "/app/.venv/bin/python",
        "-m",
        "celery",
        "-A",
        "project.celery:app",
        "worker",
        "-l",
        "INFO",
        "-Q",
        "ocr_document_queue,ocr_word_queue",
        "--concurrency",
        "1",
      ]

  worker_document:
    <<: *worker_common
    profiles:
      - ocr-dedicated
    command:
      [
        "/app/.venv/bin/python",
        "-m",
        "celery",
        "-A",
        "project.celery:app",
        "worker",
        "-l",
        "INFO",
        "-Q",
        "ocr_document_queue",
        "--concurrency",
        "1",
      ]

  worker_preview_word:
    <<: *worker_common
    profiles:
      - ocr-dedicated
    command:
      [
        "/app/.venv/bin/python",
        "-m",
        "celery",
        "-A",
        "project.celery:app",
        "worker",
        "-l",
        "INFO",
        "-Q",
        "ocr_word_queue",
        "--concurrency",
        "1",
      ]

  broker:
    image: redis:8.4.0-bookworm
    
  db:
    image: postgres:18.1-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_db:/var/lib/postgresql # 18系からvolumesのマウント先が変更になった点に注意

volumes:
  postgres_db:
  media_input:
