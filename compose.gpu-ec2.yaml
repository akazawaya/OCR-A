x-gpu-ec2-env: &gpu_ec2_env
  ENABLE_GPU_WORKER_AUTOSTART: "true"
  ENABLE_GPU_WORKER_AUTOSTOP: "true"
  GPU_WORKER_AUTOSTOP_IDLE_MINUTES: ${GPU_WORKER_AUTOSTOP_IDLE_MINUTES}
  GPU_WORKER_AUTOSTOP_CHECK_INTERVAL_SECONDS: ${GPU_WORKER_AUTOSTOP_CHECK_INTERVAL_SECONDS}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_EC2_REGION_NAME: ${AWS_EC2_REGION_NAME}
  GPU_WORKER_DOCUMENT_INSTANCE_ID: ${GPU_WORKER_DOCUMENT_INSTANCE_ID}
  GPU_WORKER_PREVIEW_WORD_INSTANCE_ID: ${GPU_WORKER_PREVIEW_WORD_INSTANCE_ID}

services:
  backend:
    environment:
      <<: *gpu_ec2_env
  worker_control:
    environment:
      <<: *gpu_ec2_env
  celery_beat:
    environment:
      <<: *gpu_ec2_env
