# 本番環境用の上書き設定
services:
  frontend:
    volumes:
      # NginxからDjango AdminのCSS/JSを読み取る。
      - django_static:/var/www/django-static:ro

  backend:
    # NginxからCompose内部ネットワーク経由でのみ接続するため、
    # 元のcomposeのポートを上書きして閉じる
    ports: !reset []
    # 一方で、Unicornによる内部通信を続投する場合、
    # backendコンテナが内部通信用に8000番を使用することは続投で良い
    expose:
      - "8000"
    restart: unless-stopped
    volumes:
      # collectstaticの出力先。project/settings.pyのSTATIC_ROOTと一致させる。
      - django_static:/app/static
    # 本番では外部RDSを使用
    depends_on: !reset []

  worker_ocr_shared:
    depends_on: !reset []

  worker_document:
    depends_on: !reset []

  worker_preview_word:
    depends_on: !reset []

  worker_gpu_autostop:
    depends_on: !reset []

  celery_beat:
    depends_on: !reset []

  # CD時の docker compose up でローカル用DB・Brokerを無視する。
  # local-infrastructure プロファイルに所属させ、これを呼ばないことで無視する
  db:
    profiles:
      - local-infrastructure

  broker:
    profiles:
      - local-infrastructure

volumes:
  django_static:
