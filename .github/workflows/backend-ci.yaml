name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "compose.backend-ci.yaml"
      - ".github/workflows/backend-ci.yaml"
  pull_request:
    paths:
      - "backend/**"
      - "compose.backend-ci.yaml"
      - ".github/workflows/backend-ci.yaml"
jobs:
  backend-test:
    runs-on: ubuntu-24.04
    env:
      DJANGO_DEBUG: ${{ vars.DJANGO_DEBUG }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_ALLOWED_HOSTS: ${{ vars.DJANGO_ALLOWED_HOSTS }}
      DJANGO_CORS_ALLOWED_ORIGINS: ${{ vars.DJANGO_CORS_ALLOWED_ORIGINS }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
      REDIS_HOST: ${{ vars.REDIS_HOST }}
      DOCUMENT_OCR_TOTAL_TIMEOUT_MINUTES: ${{ vars.DOCUMENT_OCR_TOTAL_TIMEOUT_MINUTES }}
      DOCUMENT_OCR_PAGE_TIMEOUT_MINUTES: ${{ vars.DOCUMENT_OCR_PAGE_TIMEOUT_MINUTES }}
      MAX_UPLOAD_FILE_SIZE_MB: ${{ vars.MAX_UPLOAD_FILE_SIZE_MB }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start containers
        run: docker compose -f compose.backend-ci.yaml up -d --build

      - name: Check for missing migrations
        run: docker compose -f compose.backend-ci.yaml exec -T backend /app/.venv/bin/python manage.py makemigrations --check --dry-run

      - name: Run Django checks
        run: docker compose -f compose.backend-ci.yaml exec -T backend /app/.venv/bin/python manage.py check

      - name: Run pytest
        run: docker compose -f compose.backend-ci.yaml exec -T backend uv run pytest -q --cov=app_ocr --cov-report=term-missing

      - name: Stop containers
        if: always()
        run: docker compose -f compose.backend-ci.yaml down -v
