[project]
name = "restocr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.22",
    "celery[redis]>=5.6.2",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "django>=5.2.6",
    "django-cors-headers>=4.9.0",
    "django-filter>=25.2",
    "django-storages>=1.14.6",
    "djangorestframework>=3.16.1",
    "drf-spectacular>=0.28.0",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "pillow>=11.3.0",
    "psycopg[binary]>=3.3.2",
    "pypdfium2>=4.30.0",
    "uvicorn[standard]>=0.40.0",
]

[project.optional-dependencies]
gpu = [
    "yomitoku>=0.10.3",
]

[dependency-groups]
dev = [
    "django-stubs",
    "djangorestframework-stubs",
    "httpie>=3.2.4",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.8",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "PLE", "UP"]
exclude = ["*/migrations/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings"
python_files = ["test_*.py",]

[tool.coverage.run]
branch = true
source = ["app_ocr"]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "*/__init__.py",
  "*/admin.py",
  "*/apps.py",
  "*/urls.py",
  "*/routing.py",
]
