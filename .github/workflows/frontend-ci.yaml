name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - "compose.frontend-ci.yaml"
      - ".github/workflows/frontend-ci.yaml"
  pull_request:
    paths:
      - "frontend/**"
      - "compose.frontend-ci.yaml"
      - ".github/workflows/frontend-ci.yaml"
jobs:
  frontend-test:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      FRONTEND_BUILD_TARGET: ${{ vars.FRONTEND_BUILD_TARGET }}
      FRONTEND_HOST_PORT: ${{ vars.FRONTEND_HOST_PORT }}
      FRONTEND_CONTAINER_PORT: ${{ vars.FRONTEND_CONTAINER_PORT }}
      FRONTEND_COMMAND: ${{ vars.FRONTEND_COMMAND }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build frontend image
        run: docker compose -f compose.frontend-ci.yaml build frontend

      - name: Run vitest
        run: docker compose -f compose.frontend-ci.yaml run --rm frontend npx vitest run --coverage

      - name: Stop containers
        if: always()
        run: docker compose -f compose.frontend-ci.yaml down -v
