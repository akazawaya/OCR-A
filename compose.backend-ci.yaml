name: ocr-a-backend-ci

x-django-env: &django_env
  DJANGO_DEBUG: ${DJANGO_DEBUG}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
  DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}
  REDIS_HOST: ${REDIS_HOST}
  DOCUMENT_OCR_TOTAL_TIMEOUT_MINUTES: ${DOCUMENT_OCR_TOTAL_TIMEOUT_MINUTES}
  DOCUMENT_OCR_PAGE_TIMEOUT_MINUTES: ${DOCUMENT_OCR_PAGE_TIMEOUT_MINUTES}
  MAX_UPLOAD_FILE_SIZE_MB: ${MAX_UPLOAD_FILE_SIZE_MB}

x-media-volumes: &media_volumes
  - media_input:/app/media

x-worker-common: &worker_common
  build:
    context: ./backend
    target: development
  depends_on:
    - db
    - broker
  working_dir: /app
  environment:
    <<: *django_env
  volumes: *media_volumes

services:
  backend:
    build:
      context: ./backend
      target: development
    depends_on:
      - db
      - broker
    environment:
      <<: *django_env
    volumes: *media_volumes
    command:
      [
        "/app/.venv/bin/python",
        "-m",
        "uvicorn",
        "project.asgi:application",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]

  worker_ocr_shared:
    <<: *worker_common
    profiles:
      - development-shared
    command:
      [
        "/app/.venv/bin/python",
        "-m",
        "celery",
        "-A",
        "project.celery:app",
        "worker",
        "-l",
        "INFO",
        "-Q",
        "ocr_document_queue,ocr_word_queue",
        "--concurrency",
        "1",
      ]

  worker_document:
    <<: *worker_common
    profiles:
      - development-dedicated
    command:
      [
        "/app/.venv/bin/python",
        "-m",
        "celery",
        "-A",
        "project.celery:app",
        "worker",
        "-l",
        "INFO",
        "-Q",
        "ocr_document_queue",
        "--concurrency",
        "1",
      ]

  worker_preview_word:
    <<: *worker_common
    profiles:
      - development-dedicated
    command:
      [
        "/app/.venv/bin/python",
        "-m",
        "celery",
        "-A",
        "project.celery:app",
        "worker",
        "-l",
        "INFO",
        "-Q",
        "ocr_word_queue",
        "--concurrency",
        "1",
      ]

  broker:
    image: redis:8.4.0-bookworm

  db:
    image: postgres:18.1-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_db:/var/lib/postgresql # 18系からvolumesのマウント先が変更になった点に注意

volumes:
  postgres_db:
  media_input:
